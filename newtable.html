<html>
<head>
  <title>Colspan and Rowspan Demo</title>
  <style>
    table, th, td {
      border: 1px solid black;
      border-collapse: collapse;
      padding: 8px;
      text-align: center;
      text-shadow: 3px 5px white;
      background-color: gold;
      font-size: 65px;
    }
  </style>
  
</head>
<body>

  <h1>HTML Table with Colspan and Rowspan</h1>

  <table>
    <!-- Row 1: Header row with a Colspan -->
    <tr>
      <th>Name</th>
      <th colspan="1">Roll no.</th>
      <th>Subject</th>
    </tr>

    <!-- Row 2: Data row with a Rowspan -->
    
    <tr> 
        <td> Keval </td>
        <td> 13 </td>
        <td> HTML </td>
        
     </tr> 
     
     
     <tr> 
        <td> Savan </td>
        <td> 16 </td>
        <td> Programming C </td>
        
     </tr>
     
     <tr> 
        <td> Aryan </td>
        <td> 11 </td>
        <td> Social Worker </td>
      
     </tr>
     
     
     <tr> 
        <td> Jay </td>
        <td> 06 </td>
        <td> Maths </td>
       
     </tr>
     
     
     <tr> 
        <td> Akshay </td>
        <td> 15 </td>
        <td> HVHL </td>
     
     </tr>
     <tr> 
         <td> Dhruv </td>
         <td> 12 </td>
         <td> HTML </td>
         
      </tr>
  </table>     

</body>
</html>
