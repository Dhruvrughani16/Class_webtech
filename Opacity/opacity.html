<html>
    <head>
        <title>
            CSS Opacity Example 
        </title>
        <style>
            body{
                background-color: blueviolet;
            }
            .box1{
                background-color: grey;
                opacity: 2;
            }
            .box2{
                background-color: bisque;
                opacity: 0.5;
            }
            .box3{
                background-color: aquamarine;
                opacity: 0.2;
            }
        </style>
    </head>
    <body>
        <div classs="box1">
            Opacity 1
        </div>
        <div class="box2">
            Opacity 0.5
        </div>
        <div class="box3">
            Opacity 0.1
        </div>
    </body>
</html>
