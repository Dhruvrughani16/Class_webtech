<html>
    <head>
        <title>
            CSS Filter Example 
        </title>
        <style>
            img{
                
                filter: grayscale(100%);
                background-size: cover;
                background-repeat: no-repeat;
                background-position: left;
                transition: 0.5s;
            }
            img:hover{
                filter: grayscale(0%) brightness(150%);
                
            }
            
        </style>
    </head>
    <body>
       <h2>CSS Filter Property</h2>
       <img src="abc.jpg.jpg" >
    </body>
</html>
